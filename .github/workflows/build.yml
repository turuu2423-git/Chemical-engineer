name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the built APK?'
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Configuration & Keystore
        run: |
          # Copy .env.example to .env if .env doesn't exist
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          
          # Restore debug.keystore from base64 if present
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Ensure gradlew has executable permission
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename & Prepare APK Artifact
        id: prepare_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          mkdir -p release_artifacts
          cp "$APK_PATH" release_artifacts/app-debug.apk
          echo "apk_path=release_artifacts/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: release_artifacts/app-debug.apk
          retention-days: 30

      - name: Determine Release Tag
        id: vars
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v1.0.$(date +'%Y%m%d%H%M%S')"
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: "Release ${{ steps.vars.outputs.tag_name }}"
          body: |
            ## 📱 Android Application Automated Build
            
            - **Commit**: `${{ github.sha }}`
            - **Branch/Tag**: `${{ github.ref_name }}`
            
            ### 📥 Татаж авах файл
            - **Debug APK**: `app-debug.apk` (Шууд утсан дээрээ суулгах боломжтой)
          files: |
            release_artifacts/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
