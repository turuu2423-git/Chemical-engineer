name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Configuration & Keystore
        run: |
          # Create .env if missing
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          
          # Restore debug.keystore from base64 if present
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

          # Ensure gradlew has executable permission
          chmod +x gradlew

      - name: Build Debug APK & Run Tests
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon --stacktrace

      - name: Locate and Prepare APK
        id: prepare_apk
        run: |
          mkdir -p release_artifacts
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" release_artifacts/chemical-engineer-app-debug.apk
            echo "apk_path=release_artifacts/chemical-engineer-app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "apk_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "apk_found=false" >> "$GITHUB_OUTPUT"
            echo "Error: Debug APK not generated."
            exit 1
          fi

      - name: Upload APK to Artifacts
        if: steps.prepare_apk.outputs.apk_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Chemical-Engineer-Debug-APK
          path: release_artifacts/chemical-engineer-app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: |
            ## 📱 Chemical Engineer Android App (Debug APK)
            - **Commit**: `${{ github.sha }}`
            - **Branch/Tag**: `${{ github.ref_name }}`
            
            ### 📥 Татаж авах файл
            - `chemical-engineer-app-debug.apk` утсан дээрээ суулган ашиглана уу.
          files: |
            release_artifacts/chemical-engineer-app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

